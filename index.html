<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rive</title>
<meta name="description" content="Un petit refuge au bord du lac pour les personnes hypersensibles : respirer, nommer, démêler, s’apaiser.">
<meta name="theme-color" content="#E9EFF0" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EFF0; --bg2:#DFE8EA; --card:#F8FAFA; --ink:#233740; --mut:#5C7380; --line:#D2DEE2;
  --pri:#2F6B7E; --priInk:#FFFFFF; --glacier:#9CC5CF; --sage:#7E9E86; --dusk:#E7B4A2; --duskInk:#5A2E22;
  --soft:#E1ECEE; --chip:#EEF4F5;
  --mfar:#B5C8D1; --mmid:#8BA6B3; --mnear:#6F8E9D; --shore:#6E8F78; --lake1:#7FB0C0; --lake2:#4E8799;
  --shadow:0 1px 2px rgba(35,55,64,.06), 0 8px 28px rgba(35,55,64,.07);
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --f: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A20; --bg2:#13222A; --card:#172830; --ink:#E2ECEF; --mut:#93AAB5; --line:#253A44;
    --pri:#86BFD0; --priInk:#0F1A20; --glacier:#3E6B79; --sage:#7FA28A; --dusk:#D99B86; --duskInk:#2A1510;
    --soft:#1B2F38; --chip:#1D313A;
    --mfar:#2E4652; --mmid:#253B46; --mnear:#1E323C; --shore:#1D3328; --lake1:#244A58; --lake2:#173540;
    --shadow:0 1px 2px rgba(0,0,0,.25), 0 8px 28px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A20; --bg2:#13222A; --card:#172830; --ink:#E2ECEF; --mut:#93AAB5; --line:#253A44;
  --pri:#86BFD0; --priInk:#0F1A20; --glacier:#3E6B79; --sage:#7FA28A; --dusk:#D99B86; --duskInk:#2A1510;
  --soft:#1B2F38; --chip:#1D313A;
  --mfar:#2E4652; --mmid:#253B46; --mnear:#1E323C; --shore:#1D3328; --lake1:#244A58; --lake2:#173540;
  --shadow:0 1px 2px rgba(0,0,0,.25), 0 8px 28px rgba(0,0,0,.25);
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font-family:var(--f);color:var(--ink);background:var(--bg);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.locked{overflow:hidden}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em;line-height:1.2}
h1{font-size:30px}
h2{font-size:21px}
h3{font-size:17px}
p{margin:0}
a{color:var(--pri)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--glacier);outline-offset:2px;border-radius:10px}
input,textarea{font:inherit;color:var(--ink)}
.mut{color:var(--mut)}
.small{font-size:15px}
.tiny{font-size:13px}
.stack>*+*{margin-top:12px}

/* Top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{font-weight:800;font-size:20px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;flex:1}
.brand svg{width:26px;height:26px}
.sos-pill{display:flex;align-items:center;gap:6px;background:var(--dusk);color:var(--duskInk);font-weight:800;font-size:15px;padding:8px 14px;border-radius:999px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--mut)}
.icon-btn svg{width:22px;height:22px}

main{max-width:560px;margin:0 auto;padding:0 16px}
section{margin-top:22px}

/* Hero */
.hero{margin:6px -16px 0;position:relative}
.hero svg,.hero-ill svg{display:block;width:100%;height:auto}
.hero-ill{margin:0 -20px;border-radius:0;overflow:hidden}
.hero-txt{position:absolute;left:20px;top:16px;right:20px}
.hero-txt .date{font-size:15px;font-weight:600;color:#2a4452;opacity:.85}
.hero-txt h1{color:#1e3743}
.night .hero-txt h1,.night .hero-txt .date{color:#EEF4F6}
.cairn-note{position:absolute;left:18px;bottom:10px;font-size:13px;font-weight:700;color:#F3F7F7;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.rip{animation:rip 7s ease-in-out infinite}
.rip:nth-of-type(2){animation-delay:-2.3s}.rip:nth-of-type(3){animation-delay:-4.6s}
@keyframes rip{0%,100%{opacity:.15;transform:translateX(0)}50%{opacity:.6;transform:translateX(8px)}}

/* SOS band */
.sos-band{display:flex;align-items:center;gap:16px;width:100%;text-align:left;margin-top:18px;padding:18px 18px;border-radius:var(--r-lg);background:linear-gradient(120deg,var(--dusk),color-mix(in srgb,var(--dusk) 70%,var(--bg)));color:var(--duskInk)}
.sos-band strong{display:block;font-size:20px}
.sos-band span{display:block;font-size:15px;line-height:1.4;opacity:.9;margin-top:2px}
.sos-band .ring{flex:none;width:52px;height:52px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-weight:800;font-size:14px;opacity:.85}

/* Generic card */
.card{background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.card>*+*{margin-top:10px}
.plain{padding:4px 2px}
.plain>*+*{margin-top:8px}
.label{font-size:14px;font-weight:700;color:var(--mut)}

.wx-row{display:flex;justify-content:space-between;gap:4px;margin-top:12px}
.wx{flex:1;aspect-ratio:1;max-width:58px;border-radius:50%;font-size:28px;display:grid;place-items:center;background:var(--chip);transition:transform .2s}
.wx:active{transform:scale(.92)}
.wx.on{background:var(--glacier);box-shadow:0 0 0 3px var(--pri) inset}

.quote{font-size:22px;font-weight:700;line-height:1.35;padding:18px 4px 4px;border-top:2px solid var(--line)}
.quote-src{font-size:14px;color:var(--mut)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:800;background:var(--soft);color:var(--ink)}
.btn.primary{background:var(--pri);color:var(--priInk)}
.btn.dusk{background:var(--dusk);color:var(--duskInk)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn:disabled{opacity:.45}
.link{color:var(--pri);font-weight:800;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* Tool list (not identical cards: list rows) */
.tools{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.tool{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:16px 18px}
.tool+.tool{border-top:1px solid var(--line)}
.tool .ic{flex:none;width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--soft);font-size:22px}
.tool b{display:block;font-size:17px}
.tool span{display:block;font-size:14px;color:var(--mut);line-height:1.35}
.tool .chev{margin-left:auto;color:var(--mut);flex:none}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;background:var(--chip);font-size:15px;font-weight:600;border:2px solid transparent}
.chip.on{background:var(--glacier);border-color:var(--pri);color:var(--ink)}
.chip-group+.chip-group{margin-top:14px}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:999px;font-size:14px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

textarea,.input{width:100%;border:2px solid var(--line);background:var(--card);border-radius:var(--r-md);padding:12px 14px;font-size:17px;line-height:1.45;resize:vertical}
textarea{min-height:96px}
textarea:focus,.input:focus{outline:none;border-color:var(--pri)}
.field>label{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.field+.field{margin-top:16px}

input[type=range]{width:100%;accent-color:var(--pri);height:32px}
.rangeval{font-weight:800;font-size:28px;color:var(--pri)}

/* History strip */
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:2px;text-align:center;margin-top:12px}
.strip div{font-size:18px;line-height:1.2}
.strip small{display:block;font-size:11px;color:var(--mut);font-weight:700}
.strip .none{color:var(--line)}
.entry{padding:14px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .head{display:flex;gap:10px;align-items:center}
.entry .em{font-size:26px}
.energy{letter-spacing:2px;color:var(--pri);font-size:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tags i{font-style:normal;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--mut);font-weight:600}
.excerpt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Accordions */
details.acc{background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow);margin-top:10px}
details.acc summary{list-style:none;padding:16px 18px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font-size:22px;color:var(--mut);font-weight:600}
details.acc[open] summary::after{content:"–"}
details.acc .acc-b{padding:0 18px 18px}
details.acc .acc-b>*+*{margin-top:10px}
details.acc ul{padding-left:20px;margin:0}
details.acc li+li{margin-top:6px}
.src{font-size:13px;color:var(--mut)}

/* Nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--mut);padding:4px 0;max-width:90px}
.tabs svg{width:25px;height:25px}
.tabs button.on{color:var(--pri)}

/* Overlay */
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
.ov.show{display:block;animation:ovIn .35s ease}
@keyframes ovIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ov-in{max-width:560px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom))}
.ov-head{display:flex;justify-content:space-between;align-items:center;min-height:52px;margin:0 -8px}
.ov-body>*+*{margin-top:14px}
.center{text-align:center}
.center .chips{justify-content:center}
.steps{display:flex;gap:6px}
.steps i{height:5px;flex:1;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--pri)}

/* Breathing orb */
.orb-wrap{position:relative;width:min(70vw,270px);aspect-ratio:1;margin:26px auto 8px;display:grid;place-items:center}
.orb-halo{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--line)}
.orb{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 38% 32%,#ffffffcc 0 8%,transparent 30%),radial-gradient(circle at 50% 60%,var(--lake1),var(--lake2));transform:scale(.62);box-shadow:0 20px 60px -20px var(--lake2)}
.orb-label{font-size:22px;font-weight:800;min-height:62px;padding:0 10px}

/* Guided text */
.guide-box{margin:30px 0 24px;min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:24px}
.guide-text{font-size:24px;font-weight:700;line-height:1.35}
.guide-text.in{animation:fadeIn .7s ease}
.guide-text[data-k="tense"]{color:var(--pri)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pri);border-radius:3px}

/* Grounding */
.big-n{font-size:96px;font-weight:800;line-height:1;color:var(--pri);margin-top:20px}
.dots{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:26px 0}
.dot{width:54px;height:54px;border-radius:50%;border:3px solid var(--glacier);transition:background .3s,transform .2s}
.dot.on{background:var(--glacier);transform:scale(.92)}

/* Checklist */
.check{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;padding:14px 4px;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check .box{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--mut);display:grid;place-items:center;margin-top:1px}
.check.on .box{background:var(--sage);border-color:var(--sage);color:#fff}
.check.on .box::after{content:"✓";font-weight:800;font-size:16px}

/* Trap cards */
.trap{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:var(--r-md);background:var(--chip);border:2px solid transparent}
.trap+.trap{margin-top:8px}
.trap b{display:block}
.trap span{display:block;font-size:14px;color:var(--mut)}
.trap.on{border-color:var(--pri);background:var(--glacier)}
.trap.on span{color:var(--ink)}

/* Done */
.done-stone{width:120px;margin:40px auto 10px;display:block}
.done-msg{font-size:22px;font-weight:700;line-height:1.4;margin:14px 0 30px}

/* Boats */
.lake-scene{position:relative;margin:10px -20px 0;height:330px;overflow:hidden}
.lake-scene svg.bg{position:absolute;inset:0;width:100%;height:100%}
.boat{position:absolute;left:-80%;max-width:72%;animation:sail 20s linear forwards;pointer-events:none}
.boat .sail{background:var(--card);color:var(--ink);font-size:14px;font-weight:700;padding:8px 12px;border-radius:14px 14px 14px 4px;box-shadow:var(--shadow);line-height:1.3}
.boat svg{display:block;width:70px;height:20px;margin-top:2px;animation:bob 3s ease-in-out infinite}
@keyframes sail{0%{left:-75%;opacity:0}8%{opacity:1}75%{opacity:1}100%{left:110%;opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;font-size:15px;opacity:0;transition:.35s;z-index:80;max-width:90vw;white-space:nowrap;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Toggle */
.switch{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch[aria-pressed="true"]{background:var(--sage)}
.switch[aria-pressed="true"]::after{left:23px}
.set-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0}
.set-row>div{flex:1}

.help{background:var(--soft);border-radius:var(--r-md);padding:14px 16px;font-size:15px}
.help b{font-weight:800}

/* Illustrations un peu assombries la nuit */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero svg,:root:not([data-theme="light"]) .lake-scene svg.bg,:root:not([data-theme="light"]) .ov .hero-ill svg{filter:brightness(.78) saturate(.9)}}
:root[data-theme="dark"] .hero svg,:root[data-theme="dark"] .ov .hero-ill svg,:root[data-theme="dark"] .lake-scene svg.bg{filter:brightness(.78) saturate(.9)}
/* Soft mode */
body.soft .rip,body.soft .boat svg{animation:none}
body.soft .hero svg{filter:saturate(.75)}
body.soft .ov.show{animation:none}
@media (prefers-reduced-motion: reduce){
  .rip,.boat svg,.ov.show,.guide-text.in{animation:none!important}
  .boat{animation:fadeBoat 8s ease forwards!important;left:8%!important}
}
@keyframes fadeBoat{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}
body.soft .boat{animation:fadeBoat 8s ease forwards;left:8%}
</style>
</head>
<body>
<header class="top">
  <div class="brand" aria-label="Rive">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="var(--glacier)"/><path d="M3 19 L11 9 L15 14 L20 7 L29 19 Z" fill="var(--pri)"/><path d="M3 19h26a13 13 0 0 1-26 0z" fill="var(--lake2)"/></svg>
    Rive
  </div>
  <button class="sos-pill" data-act="sos" aria-label="SOS, ça déborde">SOS</button>
  <button class="icon-btn" data-act="settings" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg></button>
</header>

<main id="view"></main>

<nav class="tabs" aria-label="Navigation">
  <button data-act="go" data-v="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 19 L9 9 L13 14 L16 10 L22 19 Z"/><path d="M2 22h20"/></svg>Le lac</button>
  <button data-act="go" data-v="meteo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><path d="M8 2v1.2M2 8h1.2M3.8 3.8l.8.8M12.2 3.8l-.8.8"/><path d="M8.5 20.5h8.5a4 4 0 0 0 .4-8 5 5 0 0 0-9.4 1.6 3.2 3.2 0 0 0 .5 6.4z"/></svg>Météo</button>
  <button data-act="go" data-v="demeler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M5.5 8c4.5-.5 9 1.5 12 6.5M4.2 13.5c4.5-1 8.5 1 10.5 5.5M9.5 4c2 3 3 8 1.8 16.3"/></svg>Démêler</button>
  <button data-act="go" data-v="douceur"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-7.5-10.4A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.5 2.5c0 5.8-7.5 10.4-7.5 10.4z"/></svg>Douceur</button>
  <button data-act="go" data-v="savoir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.5 3.5 5v13.5c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5V20"/></svg>Comprendre</button>
</nav>

<div id="overlay" class="ov" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ---------- utilitaires ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const dayKey = (d = new Date()) => { d = new Date(d); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };

let actx = null;
function audioUnlock(){ if (!S.sound) return; try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch(e) {} }
function tone(f, d){ if (!S.sound || !actx) return; try {
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
  o.type = "sine"; o.frequency.value = f;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.06, t + .3); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + .05);
} catch(e) {} }

function cairn(n, x, base){
  const Wd = [30,25,21,18,15,12,10,8], cols = ["#8E9AA0","#A9B3B7","#7F8C92","#B6BEC1","#97A4A9","#C4CBCE","#8A979D","#AEB8BC"];

  for (let i = 0; i < Math.min(n, 8); i++){ const w = Wd[i], h = w * .44, cy = y - h/2; out += `<ellipse cx="${x + (i % 2 ? 1.5 : -1.5)}" cy="${cy.toFixed(1)}" rx="${w/2}" ry="${(h/2).toFixed(1)}" fill="${cols[i]}"/>`; y = cy - h/2 + 1.2; }

}

      <p class="small">Ton système nerveux traite les informations plus en profondeur que la moyenne. Ça a un prix (la fatigue, la surcharge) et une valeur (la finesse, l’empathie, l’intuition).</p>

    <details class="acc"><summary>Orchidées, tulipes et pissenlits</summary><div class="acc-b">

      <p class="small">Le plus beau : les orchidées réagissent plus fort au négatif, mais aussi plus fort au positif. Dans un environnement doux et soutenant, elles s’épanouissent souvent plus que les autres. Prendre soin de ton environnement n’est pas un caprice, c’est ton terreau.</p>
      <p class="src">Lionetti, Aron, Aron, Burns, Jagiellowicz & Pluess, Translational Psychiatry, 2018.</p></div></details>
    <details class="acc"><summary>Le seau qui déborde</summary><div class="acc-b">

      <p class="small">D’où deux réflexes : vider le seau régulièrement (pauses, calme, nature, sommeil), et repérer tôt quand il monte. C’est exactement à ça que servent la météo intérieure et le bouton SOS.</p></div></details>

      <ul class="small">
        <li><b>Soupir cyclique</b> : dans un essai randomisé de Stanford, cinq minutes par jour pendant un mois ont amélioré l’humeur davantage que la méditation de pleine conscience, et ralenti la respiration au repos. <span class="src">Balban et al., Cell Reports Medicine, 2023.</span></li>
        <li><b>Météo intérieure</b> : mettre un mot sur une émotion diminue l’activité de l’amygdale, le centre d’alarme du cerveau. <span class="src">Lieberman et al., Psychological Science, 2007.</span></li>
        <li><b>Écriture libre</b> : écrire 15 à 20 minutes sur ce qui nous bouleverse, sur quelques jours, a des effets mesurés sur la santé physique et mentale. <span class="src">Pennebaker ; synthèse de Baikie & Wilhelm, 2005.</span></li>
        <li><b>Autocompassion</b> : la pause en trois temps (pleine conscience, humanité partagée, bienveillance) vient du programme de Kristin Neff et Christopher Germer, évalué en essai contrôlé. <span class="src">Neff & Germer, Journal of Clinical Psychology, 2013.</span></li>
        <li><b>Fait ou film ?</b> : c’est la restructuration cognitive des thérapies cognitives et comportementales, issue des travaux d’Aaron Beck sur les distorsions de pensée.</li>

        <li><b>Petits bateaux</b> : un exercice de « défusion » de la thérapie d’acceptation et d’engagement : regarder une pensée au lieu de regarder à travers elle.</li>
        <li><b>Ancrage 5-4-3-2-1 et relâchement musculaire</b> : des techniques classiques pour ramener l’attention dans le corps et le présent.</li>

    <details class="acc"><summary>Ce que Rive n’est pas</summary><div class="acc-b">
      <p class="small">Rive ne remplace pas un ou une psy. L’hypersensibilité n’est pas un trouble, mais elle peut cohabiter avec de l’anxiété, un épuisement ou une déprime. Si tu souffres souvent, depuis longtemps, ou si ça t’empêche de vivre comme tu voudrais, parles-en à ton médecin : un accompagnement (TCC, thérapie d’acceptation, sophrologie…) peut vraiment aider.</p>

      <li><a href="https://www.cambridge.org/core/product/ED2976A61F5DE56B46F07A1CE9EA9F9F/core-reader" target="_blank" rel="noopener">Baikie & Wilhelm (2005), bienfaits de l’écriture expressive</a></li>

function openBreath(key, opts = {}){
  key = BREATHS[key] ? key : "soupir";
  cur.then = opts.then || null;
  cur.b = {key, min:opts.minutes || 3};
  const b = BREATHS[key];
  openOv(`${head()}<div class="center">
    <div class="seg" id="bSeg">${Object.entries(BREATHS).map(([k, x]) => `<button class="${k === key ? "on" : ""}" data-act="bType" data-v="${k}">${x.short}</button>`).join("")}</div>
    <h2 style="margin-top:20px">${b.name}</h2><p class="mut small" style="margin-top:6px">${b.desc}</p>
    <div class="orb-wrap"><div class="orb-halo"></div><div class="orb" id="orb"></div></div>
    <p class="orb-label" id="orbLabel">Installe-toi, épaules basses.</p>
    <p class="mut small" id="bLeft">&nbsp;</p>
    <div class="chips" id="bDur" style="margin:10px 0 18px">${[1,3,5].map(m => `<button class="chip ${m === cur.b.min ? "on" : ""}" data-act="bDur" data-v="${m}">${m} min</button>`).join("")}</div>
    <button class="btn primary block" id="bStart" data-act="breathStart">Commencer</button></div>`);
  if (opts.auto) later(breathStart, 600);
}
function breathStart(){
  audioUnlock();
  $("#bStart")?.remove(); $("#bDur")?.remove(); const seg = $("#bSeg"); if (seg) seg.style.visibility = "hidden";
  const b = BREATHS[cur.b.key], end = Date.now() + cur.b.min * 60000, orb = $("#orb"), lab = $("#orbLabel"), left = $("#bLeft");
  every(() => { const s = Math.max(0, Math.ceil((end - Date.now()) / 1000)); left.textContent = s > 0 ? `${Math.floor(s/60)}:${String(s % 60).padStart(2, "0")}` : "Dernière respiration…"; }, 500);
  let i = 0;
  const step = () => {
    if (i === 0 && Date.now() >= end){ addStone(); return doneScreen("Ta respiration a ralenti. Reste là quelques secondes si tu veux, sans rien faire."); }
    const [k, txt, d, sc] = b.phases[i];
    lab.textContent = txt;
    orb.style.transition = `transform ${d}s ${k.startsWith("hold") ? "linear" : "ease-in-out"}`;
    orb.style.transform = `scale(${sc})`;
    if (k === "in") tone(440, d + .4); else if (k === "out") tone(330, Math.min(d, 4));
    i = (i + 1) % b.phases.length;
    later(step, d * 1000);
  };
  step();
}

function openGuided(key, opts = {}){

  sosBreath: () => { readSosBefore(); openBreath("soupir", {auto:true, minutes:1, then:sosMenu}); },
  sosMenu: () => { readSosBefore(); sosMenu(); },
  sosEx: t => { const o = {then:sosMenu}; ({breath:() => openBreath("soupir", {...o, minutes:1, auto:true}), ground:() => openGround(o), aid:() => openAid(o), pmr:() => openGuided("pmr", o), heart:() => openGuided("heart", o)})[t.dataset.v](); },
  sosEnd: () => sosEnd(),
  sosSave: () => sosSave(),
  breath: t => openBreath(t.dataset.v || "soupir"),
  bType: t => openBreath(t.dataset.v, {then:cur.then, minutes:cur.b?.min}),
  bDur: t => { cur.b.min = +t.dataset.v; $$("[data-act=bDur]").forEach(b => b.classList.toggle("on", b === t)); },
  breathStart: () => breathStart(),
  heart: () => openGuided("heart"),
  pmr: () => openGuided("pmr"),
  guidedStart: t => guidedStart(t),
  gTap: () => gTap(),
  gNext: () => gNext(),
  aidTog: t => { t.classList.toggle("on"); },
  aidDone: () => { if ($$(".check.on").length){ addStone(); doneScreen("Moins de lumière, moins de bruit, moins de monde : tu viens de vider un peu le seau. C’est exactement ce qu’il fallait."); } else exDone(); },
  ciNew: t => openCheckin(t.dataset.v),
  ciSave: () => ciSave(),
  tog: t => {
    const o = cur[t.dataset.o], k = t.dataset.k, v = t.dataset.v; if (!o) return;
    if (t.dataset.single){
      o[k] = o[k] === v ? null : v;
      $$(`[data-act=tog][data-o="${t.dataset.o}"][data-k="${k}"]`).forEach(b => b.classList.toggle("on", b === t && o[k] === v));
    } else {
      const i = o[k].indexOf(v); if (i >= 0) o[k].splice(i, 1); else o[k].push(v);
      t.classList.toggle("on", i < 0);
    }
  },
  journal: t => openJournal(+t.dataset.v || 0),
  jOpen: t => openJournal(0, t.dataset.id),
  jTimer: t => jTimer(t),
  jSave: () => jSave(),
  jDel: () => { if (confirm("Supprimer cette page ?")){ S.journal = S.journal.filter(x => x.id !== cur.j.id); save(); closeOv(); } },
  trNew: () => trNew(),
  trNext: () => trNext(),
  trPrev: () => trPrev(),
  trSave: () => trSave(),
  trView: t => trView(t.dataset.id),
  trDel: t => { if (confirm("Supprimer ce fil ?")){ S.thoughts = S.thoughts.filter(x => x.id !== t.dataset.id); save(); closeOv(); } },
  boats: () => openBoats(),
  boat: () => launchBoat(),
  wAdd: () => {
    const t = $("#wText").value.trim(); if (!t){ $("#wText").focus(); return; }
    S.worries.unshift({id:uid(), ts:Date.now(), text:t, due:$("#wDate").value || null, out:null});
    save(); render(); toast("Rangé dans la boîte. Tu peux le laisser là."); $("#box")?.scrollIntoView({block:"start"});
  },
  wOpen: t => wOpen(t.dataset.id),
  wOut: t => wOut(t.dataset.v),
  wSev: t => wSev(t.dataset.v),
  wDel: () => { S.worries = S.worries.filter(x => x.id !== cur.w); save(); closeOv(); },
  selfcomp: () => openSelfComp(),
  scNext: () => scNext(),
  drawCard: () => { let n; do { n = Math.floor(Math.random() * CARDS.length); } while (n === cur.card && CARDS.length > 1); cur.card = n; const el = $("#cardTxt"); el.textContent = CARDS[n]; el.classList.remove("in"); void el.offsetWidth; },
  perm: t => { const v = t.dataset.v, l = S.perms.list, i = l.indexOf(v); if (i >= 0) l.splice(i, 1); else l.push(v); t.classList.toggle("on", i < 0); save(); },
  kitAdd: () => { const i = $("#kitIn"), v = i.value.trim(); if (!v) return; S.kit.push(v); save(); render(); },
  kitDel: t => { S.kit.splice(+t.dataset.v, 1); save(); render(); },
  settings: () => openSettings(),
  setTheme: t => { S.theme = t.dataset.v; save(); applyTheme(); $$("[data-act=setTheme]").forEach(b => b.classList.toggle("on", b === t)); },
  setToggle: t => { const k = t.dataset.v; S[k] = !S[k]; save(); t.setAttribute("aria-pressed", S[k]); applyTheme(); if (k === "sound" && S.sound){ audioUnlock(); tone(440, 1.2); } },
  exportData: () => exportData(),
  importData: () => $("#importIn").click(),
  resetAll: () => { if (confirm("Tout effacer ? Ton carnet, tes relevés et ton cairn disparaîtront de ce téléphone.")){ const n = S.name; S = defaults(); S.name = n; S.welcomed = true; save(); applyTheme(); closeOv(); toast("Tout a été effacé"); } },
  hideTip: () => { S.tipHidden = true; save(); render(); },
  welcomeOk: () => { S.welcomed = true; save(); closeOv(); }
};

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const f = ACT[t.dataset.act]; if (!f) return;
  e.preventDefault(); f(t, e);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset && t.dataset.out){ const o = $("#" + t.dataset.out); if (o) o.textContent = t.value; }
  if (t.id === "jText" && cur.j && !cur.j.id){ S.draft = {pi:cur.j.pi, text:t.value}; saveSoon(); }
  if (t.id === "nameIn"){ S.name = t.value.trim() || "toi"; saveSoon(); }
});
document.addEventListener("change", e => {
  if (e.target.id !== "importIn" || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (typeof d !== "object" || !Array.isArray(d.checkins)) throw 0; S = Object.assign(defaults(), d); save(); applyTheme(); closeOv(); toast("Sauvegarde restaurée"); } catch(err) { toast("Ce fichier n’est pas une sauvegarde de Rive"); } };
  r.readAsText(e.target.files[0]);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && ov.classList.contains("show")) closeOv();
  if (e.key === "Enter" && e.target.id === "kitIn") ACT.kitAdd();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);

/* ---------- démarrage ---------- */
applyTheme();
go((location.hash || "#home").slice(1));
if (!S.welcomed) welcome();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
